<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#583e58">
  <link rel="shortcut icon" type="image/ico" href="{{ "/favicon.ico" | prepend: site.baseurl }}"/>

  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
  <!-- Preload critical resources -->
  <link rel="preload" href="{{ "/assets/css/main.css" | prepend: site.baseurl }}" as="style">
  
  <!-- Preconnect to external resources -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/assets/css/particles.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/assets/vendor/pico/pico.min.css" | prepend: site.baseurl }}">
  
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">
  
  <script>
    // Function to apply the theme synchronously
    function applyTheme() {
      let storedTheme = localStorage.getItem('theme');

      if (!storedTheme) {
        storedTheme = 'dark'; // Default to dark theme
      }

      document.documentElement.setAttribute('data-theme', storedTheme);
    }

    // Apply the theme immediately
    applyTheme();
  </script>

</head>
