---
layout: default
---

<div class="container postcont">
  <h3 class="pagetitle">
    {% if page.nav == 'homelab' %}
      <i class="fa-solid fa-flask"></i>
    {% elsif page.nav == 'projects' %}
      <i class="fa-solid fa-diagram-project"></i>
    {% else %}
      <i class="fa-solid fa-file-lines"></i>
    {% endif %}
    {{ page.title }}
  </h3>

  <hr class="pagehr" />
  <br />
  {{ content }}
</div>
