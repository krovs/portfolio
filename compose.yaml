services:
  jekyll:
    container_name: jekyll
    image: ruby:3.2-bookworm
    working_dir: /srv/jekyll
    volumes:
      - .:/srv/jekyll
    command: >
      bash -lc "
        apt update &&
        apt install -y build-essential git &&
        gem install bundler &&
        bundle config set --local path vendor/bundle &&
        bundle install &&
        bundle exec jekyll serve --host 0.0.0.0 --livereload
      "