services:
  astro:
    container_name: astro
    image: node:22-bookworm
    working_dir: /srv/astro
    user: "1000:1000"
    ports:
      - "4321:4321"
    volumes:
      - .:/srv/astro
    environment:
      - CI=true
    command: >
      bash -lc "
        npx --yes pnpm install &&
        rm -f .astro/dev.json &&
        npx --yes pnpm astro dev --host 0.0.0.0
      "
